name: agent-low-code-platform

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - npm_cache:/root/.npm
      - uv_cache:/root/.cache/uv
      # 沙箱：SandboxExecutor 用 docker CLI 起临时容器（docs/sandbox-design.md §7）。
      # 安全：socket 等价于宿主机 root，只应暴露给后端进程本身；模型参数无法影响
      # docker 参数（DockerProvider 内部构造，且有注入断言）。
      - /var/run/docker.sock:/var/run/docker.sock
      # 沙箱工作区：容器内外**同路径**，使 docker daemon 侧也能解析同一份文件（§8.1）。
      - /srv/agent/workspaces:/srv/agent/workspaces
    environment:
      DATABASE_URL: postgresql://saas:saas@db:5432/saas
      JWT_SECRET: dev-secret
      OLLAMA_HOST: http://host.docker.internal:11434
      # 沙箱工作区根（必须是独立目录，不能是仓库根——见 §9.2）
      SANDBOX_WORKSPACE_ROOT: /srv/agent/workspaces
      # 论文域 MCP 内部总结用 LLM（OpenAI 兼容网关，在 .env 中填写）
      PAPER_LLM_BASE_URL: ${PAPER_LLM_BASE_URL:-}
      PAPER_LLM_API_KEY: ${PAPER_LLM_API_KEY:-}
      PAPER_LLM_MODEL: ${PAPER_LLM_MODEL:-}
    ports:
      - "8000:8000"
      - "9001:9001"
      - "9002:9002"
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    command: npx next dev -p 3003 -H 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3003:3003"
    depends_on:
      - backend

  redis:
    image: redis/redis-stack:7.4.0-v2
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

volumes:
  pgdata:
  npm_cache:
  uv_cache:
  redis-data:
  redisinsight-data:
