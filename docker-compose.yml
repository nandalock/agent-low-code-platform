services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - npm_cache:/root/.npm
      - uv_cache:/root/.cache/uv
    environment:
      DATABASE_URL: postgresql://saas:saas@db:5432/saas
      JWT_SECRET: dev-secret
      OLLAMA_HOST: http://host.docker.internal:11434
    ports:
      - "8000:8000"
      - "9001:9001"
    depends_on:
      - db

  frontend:
    build: ./frontend
    command: npx next dev -p 3003 -H 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3003:3003"
    depends_on:
      - backend

volumes:
  pgdata:
  npm_cache:
  uv_cache:
