name: agent-low-code-platform

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - npm_cache:/root/.npm
      - uv_cache:/root/.cache/uv
      # 沙箱：SandboxExecutor 用 docker CLI 起临时容器（docs/sandbox-design.md §7）。
      # 安全：socket 等价于宿主机 root，只应暴露给后端进程本身；模型参数无法影响
      # docker 参数（DockerProvider 内部构造，且有注入断言）。
      - /var/run/docker.sock:/var/run/docker.sock
      # 沙箱工作区：容器内外**同路径**，使 docker daemon 侧也能解析同一份文件（§8.1）。
      - /srv/agent/workspaces:/srv/agent/workspaces
      # 沙箱写根（SANDBOX_WRITE_ROOTS）也要挂进 backend 容器本身：API 的文件树/
      # 预览/上传直接读宿主目录——daemon 挂载只解决沙箱容器视角，backend 进程
      # 自己看不见 D:/。约定容器内路径 /srv/host-write/<目录名>（api/workspace.py
      # 的 _BACKEND_WRITE_MOUNT_BASE）。多个写根时逐行加。
      - D:/jk/Nexus:/srv/host-write/Nexus
      # 读根（SANDBOX_READ_ROOTS）同样要挂进 backend 本身：文件系统选择器要把磁盘
      # 列给用户看，而列举发生在 API 进程里。挂载名与沙箱容器的 /mnt/read/<名> 一致
      # （同一个 mount_name），整盘根只留盘符（C:/ → C）。
      #
      # **backend 侧 rw，沙箱侧 :ro** —— 这条分工是 2026-09-15 拆开的。读轴限制的
      # 是**模型**能写哪（沙箱容器的挂载，见 sandbox/backends/docker.py 的 read_args，
      # 那里恒为 :ro，与这里无关）；而用户在界面上自己新建文件夹、上传文件是**人**的
      # 动作，不该被模型的沙箱规则管。早先这里也是 :ro，于是 D:/ 里除了写根哪都建不了
      # ——「新建的是人，为什么要限制」，问得对。
      #
      # :ro 在这里也从来不是有效防线：本容器已挂 /var/run/docker.sock（等价宿主 root，
      # 见上），能跟 daemon 说话的人本就能把宿主盘 rw 挂进临时容器随便写。
      #
      # 读根仍可被选为工作区，那种会话由 sandbox/runtime.py 的 session_default_mode
      # 落 read-only —— 限制的依然是**模型**，不是用户。
      #
      # 多个读根逐行加，并与 .env 的 SANDBOX_READ_ROOTS
      # 保持同步：只在这里挂、.env 里没配的根不会出现在选择器里（反之亦然，配了却没
      # 挂会被 _browse_roots 滤掉，不出现幽灵条目）。改完要 up -d backend 重建容器。
      - C:/:/srv/host-read/C
      - D:/:/srv/host-read/D
    environment:
      DATABASE_URL: postgresql://saas:saas@db:5432/saas
      JWT_SECRET: dev-secret
      OLLAMA_HOST: http://host.docker.internal:11434
      # 沙箱工作区根（必须是独立目录，不能是仓库根——见 §9.2）
      SANDBOX_WORKSPACE_ROOT: /srv/agent/workspaces
      # 附加**只读**挂进沙箱的宿主目录（逗号分隔，绝对路径）。沙箱容器由
      # backend 经 docker.sock 起，daemon 直接解析宿主路径，故这里写 Windows
      # 盘符形式即可——backend 容器自己**不需要**挂这些目录（隔离不受影响）。
      # 挂载恒为 :ro，只拓宽读、不拓宽写。模型看到的路径是 /mnt/read/<目录名>。
      # 例：SANDBOX_READ_ROOTS: "D:/jk/Papers,D:/jk/Documents"
      SANDBOX_READ_ROOTS: ${SANDBOX_READ_ROOTS:-}
      # 附加**可写**挂进沙箱的宿主目录（逗号分隔，绝对路径）。与只读根同源
      # （都由 daemon 解析宿主路径），但方向相反：它增加写面，因此只在
      # workspace-write 模式下挂载，read-only 下一个都不挂。
      # 模型看到的路径是 /mnt/write/<目录名>，可直接修改其中的文件。
      # 例：SANDBOX_WRITE_ROOTS: "D:/jk/Nexus"
      SANDBOX_WRITE_ROOTS: ${SANDBOX_WRITE_ROOTS:-}
      # 论文域 MCP 内部总结用 LLM（OpenAI 兼容网关，在 .env 中填写）
      PAPER_LLM_BASE_URL: ${PAPER_LLM_BASE_URL:-}
      PAPER_LLM_API_KEY: ${PAPER_LLM_API_KEY:-}
      PAPER_LLM_MODEL: ${PAPER_LLM_MODEL:-}
    ports:
      - "8000:8000"
      # 9001/9002（MCP server）不映射到宿主：它们由本容器内的 uvicorn 起（main.py），
      # 消费者也只有本容器自己（adapters/mcp.py 走 localhost），映射纯属多余。
      # 且 Windows 上 9002 会落进 Hyper-V/WSL 的保留端口段（netsh int ipv4 show
      # excludedportrange protocol=tcp），Docker 绑定时报 WSAEACCES 起不来。
      # 需要在宿主调试 MCP：docker compose exec backend curl localhost:9001/mcp
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    # 宿主端口不能用 3000 系：Windows 的 Hyper-V/WSL 保留端口段
    # （netsh int ipv4 show excludedportrange protocol=tcp）在这台机器上连成
    # 2717-3406，3000/3003/3200 全在里面，Docker 绑定时报 WSAEACCES 起不来
    # （同 backend 段 9002 的注释）。4000 离保留段顶端有近 600 个端口余量——
    # 留足余量是因为这段范围**每次重启会重新分配、整体漂移**，贴着边选早晚再撞。
    # 容器内外统一用它，免得 package.json 的 dev/start 在宿主直跑时又踩同一个坑。
    command: npx next dev -p 4000 -H 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "4000:4000"
    depends_on:
      - backend

  redis:
    image: redis/redis-stack:7.4.0-v2
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

volumes:
  pgdata:
  npm_cache:
  uv_cache:
  redis-data:
  redisinsight-data:
