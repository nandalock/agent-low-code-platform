name: agent-low-code-platform

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - npm_cache:/root/.npm
      - uv_cache:/root/.cache/uv
      # 沙箱：SandboxExecutor 用 docker CLI 起临时容器（docs/sandbox-design.md §7）。
      # 安全：socket 等价于宿主机 root，只应暴露给后端进程本身；模型参数无法影响
      # docker 参数（DockerProvider 内部构造，且有注入断言）。
      - /var/run/docker.sock:/var/run/docker.sock
      # 沙箱工作区：容器内外**同路径**，使 docker daemon 侧也能解析同一份文件（§8.1）。
      - /srv/agent/workspaces:/srv/agent/workspaces
    environment:
      DATABASE_URL: postgresql://saas:saas@db:5432/saas
      JWT_SECRET: dev-secret
      OLLAMA_HOST: http://host.docker.internal:11434
      # 沙箱工作区根（必须是独立目录，不能是仓库根——见 §9.2）
      SANDBOX_WORKSPACE_ROOT: /srv/agent/workspaces
      # 附加**只读**挂进沙箱的宿主目录（逗号分隔，绝对路径）。沙箱容器由
      # backend 经 docker.sock 起，daemon 直接解析宿主路径，故这里写 Windows
      # 盘符形式即可——backend 容器自己**不需要**挂这些目录（隔离不受影响）。
      # 挂载恒为 :ro，只拓宽读、不拓宽写。模型看到的路径是 /mnt/read/<目录名>。
      # 例：SANDBOX_READ_ROOTS: "D:/jk/Papers,D:/jk/Documents"
      SANDBOX_READ_ROOTS: ${SANDBOX_READ_ROOTS:-}
      # 论文域 MCP 内部总结用 LLM（OpenAI 兼容网关，在 .env 中填写）
      PAPER_LLM_BASE_URL: ${PAPER_LLM_BASE_URL:-}
      PAPER_LLM_API_KEY: ${PAPER_LLM_API_KEY:-}
      PAPER_LLM_MODEL: ${PAPER_LLM_MODEL:-}
    ports:
      - "8000:8000"
      # 9001/9002（MCP server）不映射到宿主：它们由本容器内的 uvicorn 起（main.py），
      # 消费者也只有本容器自己（adapters/mcp.py 走 localhost），映射纯属多余。
      # 且 Windows 上 9002 会落进 Hyper-V/WSL 的保留端口段（netsh int ipv4 show
      # excludedportrange protocol=tcp），Docker 绑定时报 WSAEACCES 起不来。
      # 需要在宿主调试 MCP：docker compose exec backend curl localhost:9001/mcp
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    command: npx next dev -p 3003 -H 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3003:3003"
    depends_on:
      - backend

  redis:
    image: redis/redis-stack:7.4.0-v2
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

volumes:
  pgdata:
  npm_cache:
  uv_cache:
  redis-data:
  redisinsight-data:
